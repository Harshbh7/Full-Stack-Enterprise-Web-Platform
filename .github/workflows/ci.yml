name: EduSphere CI/CD Quality Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-quality:
    name: Backend Lint, Typecheck & Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Type Check Backend
        working-directory: backend
        run: npm run lint

      - name: Run Backend Tests
        working-directory: backend
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/edusphere_test
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: ci_test_access_secret_12345
          JWT_REFRESH_SECRET: ci_test_refresh_secret_67890
        run: npm test

      - name: Build Backend Production Bundle
        working-directory: backend
        run: npm run build

  frontend-quality:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Type Check Frontend
        working-directory: frontend
        run: npm run lint

      - name: Build Frontend Distribution
        working-directory: frontend
        run: npm run build
